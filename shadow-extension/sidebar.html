<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadow Browser Agent</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=Space+Grotesk:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="sidebar.css">
</head>
<body>
    <div class="glass-container">
        <!-- Header -->
        <header>
            <div class="logo">
                <span class="brand-gradient">SHADOW</span>
                <span class="sub-label">Autonomous Agent</span>
            </div>
            <div class="header-actions">
                <button id="toggle-settings-btn" title="Settings">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                    </svg>
                </button>
                <div id="status-pill" class="status-pill disconnected">
                    <span class="dot"></span>
                    <span id="status-text">OFFLINE</span>
                </div>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="content-slider">
            <!-- Chat Panel -->
            <section id="chat-panel" class="panel active">
                <div id="chat-messages" class="chat-messages">
                    <div class="message system-msg">
                        Welcome to <strong>Shadow Browser Agent</strong>. Connected directly to Shadow backend.
                        Type your instructions below to start browser automation.
                    </div>
                </div>
                
                <!-- Input Area -->
                <div class="input-area-wrapper">
                    <div class="input-area">
                        <textarea id="prompt-input" placeholder="Instruct Shadow (e.g. find a coffee machine under $100)..."></textarea>
                        <button id="send-btn">
                            <svg viewBox="0 0 24 24" width="18" height="18">
                                <path fill="currentColor" d="M2,21L23,12L2,3V10L17,12L2,14V21Z" />
                            </svg>
                        </button>
                    </div>
                </div>
            </section>

            <!-- Settings Panel -->
            <section id="settings-panel" class="panel">
                <div class="settings-container">
                    <h3>Configuration</h3>
                    
                    <div class="setting-item">
                        <label for="setting-base-url">LLM API Base URL</label>
                        <input type="text" id="setting-base-url" placeholder="https://gen.pollinations.ai/v1">
                    </div>

                    <div class="setting-item">
                        <label for="setting-api-key">LLM API Key</label>
                        <input type="password" id="setting-api-key" placeholder="Enter API Key">
                    </div>

                    <div class="setting-item">
                        <label for="setting-model">LLM Model</label>
                        <input type="text" id="setting-model" placeholder="deepseek">
                    </div>

                    <div class="setting-item">
                        <label for="setting-temp">Temperature (0.0 - 1.0)</label>
                        <input type="number" id="setting-temp" step="0.1" min="0" max="1" placeholder="0.0">
                    </div>

                    <div class="setting-actions">
                        <button id="save-settings-btn" class="primary-btn">Save Configurations</button>
                        <button id="back-chat-btn" class="secondary-btn">Back to Chat</button>
                    </div>

                    <div id="settings-toast" class="toast">Settings saved!</div>
                </div>
            </section>
        </main>
    </div>
    <script src="sidebar.js"></script>
</body>
</html>
